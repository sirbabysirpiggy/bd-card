<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羅子杰生日快樂</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 擷取卡片邊緣的暖白底色 */
        body {
            background-color: #fcf9f2; 
            font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
        }

        /* 錯誤震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        .shake-animation {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 卡片容器設定 */
        #card-container {
            width: 100%;
            max-width: 420px; /* 配合圖片垂直比例調整最大寬度 */
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08), 0 10px 15px -6px rgba(0, 0, 0, 0.04);
            background-color: #fff;
        }

        /* 確保 Canvas 響應式縮放，但維持內部高解析度 */
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 隱藏預設捲動條 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <!-- 整體群組垂直置中 -->
    <div id="interactive-group" class="flex flex-col items-center w-full max-w-md gap-8">
        
        <!-- 卡片區塊 (Canvas 負責渲染 A 與轉場至 B) -->
        <div id="card-container" class="transition-transform duration-300">
            <canvas id="main-canvas"></canvas>
        </div>

        <!-- 互動輸入區塊 -->
        <div id="input-section" class="w-full text-center flex flex-col items-center opacity-100 transition-opacity duration-500">
            <label for="answer-input" class="text-[#7a7a7a] text-sm mb-4 block leading-relaxed font-medium">
                請問卡片是以什麼元素為設計理念？<br>
                請輸入答案以解鎖卡片內容
            </label>
            <div class="relative w-full max-w-xs">
                <!-- 輸入框配色擷取圖檔的粉藍與暖黃 -->
                <input 
                    type="text" 
                    id="answer-input" 
                    class="w-full px-6 py-3 rounded-full border-2 border-[#d0e6f5] bg-white text-[#595959] focus:outline-none focus:border-[#fce8a1] focus:ring-4 focus:ring-[#fdf4d6] transition-all text-center placeholder-[#cccccc]"
                    placeholder="請輸入答案..."
                    autocomplete="off"
                    disabled
                >
            </div>
            <!-- 隱藏的提示訊息 -->
            <p id="error-message" class="text-[#e57373] text-sm mt-3 h-5 opacity-0 transition-opacity">答案不正確，請再試一次</p>
        </div>

    </div>

    <script>
        const answerInput = document.getElementById('answer-input');
        const cardContainer = document.getElementById('card-container');
        const inputSection = document.getElementById('input-section');
        const errorMessage = document.getElementById('error-message');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        
        // 核心解答邏輯
        const TARGET_KEYWORD = "漢堡";

        // 影像物件宣告
        const imgA = new Image();
        const imgB = new Image();
        let imagesLoaded = 0;

        // 影像載入完成後的處理
        function onImageLoad() {
            imagesLoaded++;
            if (imagesLoaded === 2) {
                // 兩張圖皆載入完成，初始化 Canvas 尺寸為原始圖片尺寸
                canvas.width = imgA.width;
                canvas.height = imgA.height;
                
                // 初始繪製卡片 A
                ctx.drawImage(imgA, 0, 0);
                
                // 解除輸入框鎖定
                answerInput.disabled = false;
                answerInput.focus();
            }
        }

        // 處理圖片載入失敗的情況 (例如路徑或副檔名錯誤)
        function onImageError() {
            // 設定具體的備用尺寸，防止畫布因沒有內容而被 CSS 壓縮導致文字切斷
            canvas.width = 420;
            canvas.height = 560;
            ctx.fillStyle = '#ffe4e1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#d49a9a';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'center';
            // 修正錯誤提示以符合實際請求的副檔名
            ctx.fillText('無法載入圖檔，請確認 A.png 與 B.png 位於同目錄', canvas.width/2, canvas.height/2);
        }

        // 設定圖片來源並綁定事件
        imgA.onload = onImageLoad;
        imgA.onerror = onImageError;
        imgA.src = 'A.png'; // 變更為實際的 png 格式

        imgB.onload = onImageLoad;
        imgB.onerror = onImageError;
        imgB.src = 'B.png'; // 變更為實際的 png 格式

        // 監聽輸入事件
        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyAnswer(this.value);
            }
        });

        function verifyAnswer(inputValue) {
            if (inputValue.includes(TARGET_KEYWORD)) {
                handleSuccess();
            } else {
                handleError();
            }
        }

        function handleError() {
            cardContainer.classList.remove('shake-animation');
            void cardContainer.offsetWidth; 
            cardContainer.classList.add('shake-animation');
            
            errorMessage.style.opacity = '1';
            answerInput.value = '';
            answerInput.focus();

            setTimeout(() => {
                errorMessage.style.opacity = '0';
            }, 2000);
        }

        function handleSuccess() {
            answerInput.disabled = true;
            inputSection.style.opacity = '0';
            setTimeout(() => {
                inputSection.style.display = 'none';
            }, 500);

            startParticleTransition();
        }

        function startParticleTransition() {
            const w = canvas.width;
            const h = canvas.height;
            
            // 決定顆粒大小，根據原始圖片寬度動態計算以確保解析度適應
            const particleSize = Math.max(Math.floor(w / 45), 8); 
            const cols = Math.ceil(w / particleSize);
            const rows = Math.ceil(h / particleSize);
            const particles = [];

            // 建立網格顆粒陣列
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // 計算此顆粒掉落的閾值。Y軸越下方數值越大，加入隨機性打亂邊緣
                    const baseDelay = y * 1.8; 
                    const randomDelay = Math.random() * 25;
                    
                    particles.push({
                        col: x,
                        row: y,
                        x: x * particleSize,
                        y: y * particleSize,
                        size: particleSize,
                        delayThreshold: baseDelay + randomDelay,
                        drawn: false
                    });
                }
            }

            let currentFrame = 0;
            const animationSpeed = 1.5;

            function renderParticles() {
                let allDrawn = true;
                currentFrame += animationSpeed;

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    if (!p.drawn) {
                        allDrawn = false;
                        if (currentFrame > p.delayThreshold) {
                            // 直接從 imgB 擷取對應區塊繪製到 main-canvas
                            // 這種做法可避免 Canvas 像素讀取所造成的本地端安全限制報錯
                            ctx.drawImage(
                                imgB, 
                                p.x, p.y, p.size, p.size, // 來源裁切位置與大小
                                p.x, p.y, p.size, p.size  // 目標繪製位置與大小
                            );
                            p.drawn = true;
                        }
                    }
                }

                if (!allDrawn) {
                    requestAnimationFrame(renderParticles);
                } else {
                    // 動畫結束後，為確保無接縫，完整重繪一次目標影像
                    ctx.drawImage(imgB, 0, 0);
                }
            }

            requestAnimationFrame(renderParticles);
        }
    </script>
</body>
</html>
